<!DOCTYPE html>
<html lang="fr" data-mode="deep">
<head>
<meta charset="utf-8">
<title>Deep Talk — Cartes à questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Une pile de cartes à piocher pour lancer de vraies conversations. Deux modes : Deep Talk et Crousti.">
<meta name="theme-color" content="#08090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name" id="brandName">Deep&nbsp;Talk</span>
    </div>
    <p class="counter" id="counter" aria-live="polite">—</p>
  </header>

  <!-- Avancement du paquet en cours -->
  <div class="progress" id="progress" role="img" aria-label="Progression du paquet">
    <span class="progress__fill" id="progressFill"></span>
  </div>

  <main class="stage">

    <!-- Le paquet -->
    <div class="deck" id="deck">
      <div class="deck__layer" data-layer="3" aria-hidden="true"></div>
      <div class="deck__layer" data-layer="2" aria-hidden="true"></div>
      <div class="deck__layer" data-layer="1" aria-hidden="true"></div>

      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">

          <!-- Dos de carte : ce qu'on voit dans la pile -->
          <button class="face face--back" id="drawBtn" type="button" aria-label="Piocher une carte">
            <span class="face__frame">
              <span class="emblem" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <circle cx="25" cy="32" r="15" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="39" cy="32" r="15" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </span>
              <span class="face__hint">Touchez pour piocher</span>
            </span>
          </button>

          <!-- Face avant : la question -->
          <div class="face face--front" id="front">
            <div class="card-head">
              <!-- Constellation propre à cette question, générée depuis son texte -->
              <div class="sigil" id="sigil" aria-hidden="true"></div>
              <span class="eyebrow" id="eyebrow"></span>
            </div>
            <p class="question" id="question"></p>
            <button class="next-btn" id="nextBtn" type="button">Carte suivante</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Paquet épuisé -->
    <div class="endscreen" id="endscreen" hidden>
      <p class="endscreen__title">Vous avez fait le tour.</p>
      <p class="endscreen__text" id="endText"></p>
      <div class="endscreen__actions">
        <button class="ghost-btn ghost-btn--strong" id="swapBtn" type="button" hidden></button>
        <button class="ghost-btn" id="restartBtn" type="button">Remélanger le paquet</button>
      </div>
    </div>

  </main>

  <footer class="footbar">
    <p class="tagline" id="tagline"></p>
    <div class="modes" id="modes" role="tablist" aria-label="Mode de jeu">
      <button class="mode-btn is-on" type="button" role="tab" data-mode="deep" aria-selected="true">Deep Talk</button>
      <button class="mode-btn" type="button" role="tab" data-mode="crousti" aria-selected="false">Crousti</button>
    </div>
  </footer>

</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
