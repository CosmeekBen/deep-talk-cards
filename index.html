<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Deep Talk — Cartes à questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="Une pile de cartes à piocher pour lancer de vraies conversations.">
<meta name="theme-color" content="#14101f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Deep&nbsp;Talk</span>
    </div>
    <p class="counter" id="counter" aria-live="polite">— cartes</p>
  </header>

  <main class="stage">

    <!-- Le paquet -->
    <div class="deck" id="deck">
      <div class="deck__layer" data-layer="3" aria-hidden="true"></div>
      <div class="deck__layer" data-layer="2" aria-hidden="true"></div>
      <div class="deck__layer" data-layer="1" aria-hidden="true"></div>

      <div class="card-wrap" id="cardWrap">
        <div class="card" id="card">

          <!-- Dos de carte : ce qu'on voit dans la pile -->
          <button class="face face--back" id="drawBtn" type="button" aria-label="Piocher une carte">
            <span class="face__frame">
              <span class="emblem" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <circle cx="25" cy="32" r="15" stroke="currentColor" stroke-width="1.5"/>
                  <circle cx="39" cy="32" r="15" stroke="currentColor" stroke-width="1.5"/>
                </svg>
              </span>
              <span class="face__hint">Touchez pour piocher</span>
            </span>
          </button>

          <!-- Face avant : la question -->
          <div class="face face--front" id="front">
            <span class="theme" id="theme"></span>
            <p class="question" id="question"></p>
            <button class="next-btn" id="nextBtn" type="button">
              Carte suivante
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Fin du paquet -->
    <div class="endscreen" id="endscreen" hidden>
      <p class="endscreen__title">Vous avez fait le tour.</p>
      <p class="endscreen__text">Toutes les cartes ont été piochées.</p>
      <button class="ghost-btn" id="restartBtn" type="button">Remélanger le paquet</button>
    </div>

  </main>

  <footer class="footbar">
    <p id="footHint">Une question à la fois. Prenez le temps.</p>
  </footer>

</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
